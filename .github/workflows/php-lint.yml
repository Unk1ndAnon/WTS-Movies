name: PHP syntax check

on:
  push:
    branches: [main, tstream-watch-upgrade, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check JS/main.js
      - name: Guard catalogue TMDB client usage
        run: |
          if grep -nE 'tmdb_fetch_url|file_get_contents\(.*api\.themoviedb\.org' index.php movies.php trending-movies.php top-rated-movies.php tv.php trending-tv.php top-rated-tv.php; then
            echo "Legacy direct TMDB request found in a catalogue page."
            exit 1
          fi
          for file in index.php movies.php trending-movies.php top-rated-movies.php tv.php trending-tv.php top-rated-tv.php; do
            grep -q 'tmdb_request' "$file" || { echo "Missing shared TMDB client in $file"; exit 1; }
          done
      - name: Ensure private TMDB configuration is not tracked
        run: |
          if git ls-files --error-unmatch includes/config.local.php >/dev/null 2>&1; then
            echo "Private TMDB config must not be committed."
            exit 1
          fi

      - name: Check JavaScript syntax
        run: node --check JS/main.js
